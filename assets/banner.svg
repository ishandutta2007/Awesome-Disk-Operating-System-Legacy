<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="12" />

  <!-- Animated Dynamic Background Grid & Oscillating Pulse -->
  <g opacity="0.15">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#38bdf8" stroke-width="1">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Dynamic Floating Decorative Tech Cards in Background -->
  <g id="dynamic-cards" opacity="0.4">
    <!-- Card 1 -->
    <rect x="80" y="40" width="160" height="60" rx="8" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.3)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="95" y="75" fill="#38bdf8" font-size="12" font-family="monospace">C:\&gt; FREEDOS 1.4</text>

    <!-- Card 2 -->
    <rect x="960" y="180" width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="rgba(192,132,252,0.3)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="7s" repeatCount="indefinite" />
    </rect>
    <text x="975" y="210" fill="#c084fc" font-size="12" font-family="monospace">MODE CO80: READY</text>
    <text x="975" y="230" fill="#94a3b8" font-size="10" font-family="monospace">CPU: 8086 / Z80</text>

    <!-- Floating Glowing Particles -->
    <circle cx="200" cy="220" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="220;200;220" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="80" r="5" fill="#c084fc">
      <animate attributeName="cy" values="80;100;80" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Main Banner Content -->
  <g text-anchor="middle">
    <!-- Icon / Sub-badge -->
    <rect x="510" y="45" width="180" height="30" rx="15" fill="rgba(56,189,248,0.1)" stroke="url(#glowGrad)" stroke-width="1.5" />
    <text x="600" y="65" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1">RETRO COMPUTING</text>

    <!-- Main Title -->
    <text x="600" y="140" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Disk Operating System
    </text>

    <text x="600" y="185" fill="url(#glowGrad)" font-size="34" font-weight="700">
      Legacy &amp; Emulation Archive
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" fill="#94a3b8" font-size="16" font-weight="400">
      Curated classic DOS, open-source replacements, hardware emulators &amp; WebAssembly preservation
    </text>

    <!-- Console Prompt Line -->
    <g transform="translate(420, 260)">
      <rect x="0" y="0" width="360" height="34" rx="6" fill="#020617" stroke="rgba(255,255,255,0.1)" />
      <text x="15" y="22" fill="#22c55e" font-size="14" font-family="monospace" text-anchor="start">A:\&gt; DIR /W *.*</text>
      <rect x="145" y="10" width="8" height="14" fill="#22c55e">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
